<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="../../../assets/img/favicon.png" />
        <link rel="stylesheet" href="..//style.css" />
        <script
            async
            src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"
        ></script>
        <script src="https://cdn.plot.ly/plotly-4.0.0.min.js"></script>
        <title>Physics simulations</title>
    </head>
    <body>
        <header>
            <div class="header-container">
                <h1>Lorenz attractor</h1>
                <a href="../../../index.html" class="home-button"> <i class="fa-solid fa-house text-xl"></i> </a>
                <a href="../" class="home-button"> <i class="fa-solid fa-atom text-xl"></i> </a>
            </div>
        </header>
        <main>
            <section class="prose">
                <p>
                    Description
                </p>
                <p>
                    The simulation can be customized by adjusting ...
                </p>
            </section>
            <section class="form-and-plot">
                <div>
                    <form id="dataForm" class="form">
                        <label for="nInput" class="self-center">Number of points</label>
                        <input
                            type="number"
                            id="nInput"
                            name="n"
                            value="5"
                            min="1"
                            step="1"
                        />

                        <label for="TInput" class="self-center">Simulation time</label>
                        <input
                            type="number"
                            id="TInput"
                            name="T"
                            value="10"
                            min="1"
                            step="1"
                        />

                        
                        <div class="col-span-2 flex justify-start gap-5">
                            <button type="submit" id="calculateButton">Calculate</button>
                            <button type="button" id="resetButton">Reset</button>
                        </div>

                        <div id="loader" class="loader-container flex">
                            <div id="loaderSpinner" class="loader"></div>
                            <p id="loaderText"></p>
                        </div>
                    </form>
                </div>

                <div id="plot" class="plot-container"></div>
            </section>
        </main>
    </body>

    <script type="module">
        async function main() {
            const calculateButton = document.getElementById("calculateButton");
            const resetButton = document.getElementById("resetButton");

            resetButton.addEventListener("click", () => {
                // Reset form to default values
                document.getElementById("nInput").value = "1";
                document.getElementById("TInput").value = "10";

                // Reload the page
                window.location.reload();
            });

            try {
                // Initialize worker
                calculateButton.disabled = true;
                document.getElementById("loaderSpinner").style.visibility = 'visible';
                document.getElementById("loaderText").textContent = "Loading Python... ";

                const response = await fetch("lorenz.py");
                const initCode = await response.text();

                let worker = new Worker("../pyodide_background_worker.js");
                let animationId;

                // load python packages
                await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        if (e.data.type === "ready") {
                            calculateButton.disabled = false;
                            resolve();
                        }
                        else if (e.data.type === "error") reject(e.data.error);
                    };

                    worker.postMessage({
                        type: "init",
                        initCode: initCode,
                        packages: ["numpy", "scipy"],
                    });
                });
                
                const form = document.getElementById("dataForm");
                form.addEventListener("submit", async (e) => {
                    // disable the submit button
                    calculateButton.disabled = true;
                    e.preventDefault(); // ?
                    // parse the input data
                    const n = parseFloat(
                        document.getElementById("nInput").value,
                    );

                    const T = parseFloat(
                        document.getElementById("TInput").value,
                    );

                    return new Promise((resolve, reject) => {
                        worker.onmessage = function (e) {
                            // when you receive a message from the pyodide worker:
                            // enable the submit button
                            calculateButton.disabled = false;
                            // if the calculation was successful, plot the results:
                            if (e.data.type === "result") {
                                // this is the output data converted to JavaScript from Python
                                const [x, y, z] = e.data.data;
                                // not loading anymore: make the loader button invisible
                                
                                document.getElementById("loaderSpinner")
                                    .style.visibility = 'hidden';
                                document.getElementById("loaderText")
                                    .textContent = "Integration completed";

                                // this is a compact way to load all the traces
                                //   x,y,z [t][k] for sample k at time t
                                /*let traces = Array.from(x[0]).map(
                                    (xk, k) => ({
                                        x: [xk],
                                        y: [y[0][k]],
                                        z: [z[0][k]],
                                        mode: "markers",
                                        marker: { size: 1 },
                                        type: 'scatter3d',
                                    }),
                                );*/
                                let traces = [{
                                    x: x[0], y: y[0], z: z[0],
                                    mode: "markers",
                                    marker: { size: 3 },
                                    type: 'scatter3d',
                                }]

                                let layout = {
                                    xaxis: {
                                        range: [-20,20],
                                    },
                                    yaxis: {
                                        range: [-25,25],
                                    },
                                    zaxis: {
                                        range: [0,50],
                                    },
                                    height: 500,
                                    showlegend: false,
                                    margin: { l: 0, r: 0, b: 0, t: 0 }
                                }
                                
                                // create the plot
                                Plotly.newPlot(
                                    "plot",
                                    traces,
                                    layout,
                                    { responsive: true },
                                );
                                
                                // animate the plot, where i is time index
                                let i = 0;
                                function update() {
                                    i = (i+1)%x.length; // time loop
                                    
                                    /*let newTraces = Array.from(x[i]).map(
                                        (xik, k) => ({
                                            x: [xik],
                                            y: [y[i][k]],
                                            z: [z[i][k]],
                                        }),
                                    );*/
                                    Plotly.extendTraces("plot",
                                        {x: [[x[i]]], y: [[y[i]]], z: [[z[i]]]},
                                        [0],
                                        x.length*x[0].length
                                    );

                                    /*Plotly.relayout("plot", layout)
                                    Plotly.animate("plot",
                                        { data: newTraces },
                                        {
                                            transition: { duration: 0 },
                                            frame: {
                                                duration: 0,
                                                redraw: false,
                                            },
                                        },
                                    );*/

                                    animationId = requestAnimationFrame(update);
                                }

                                if (animationId) {
                                    cancelAnimationFrame(animationId);
                                }
                                animationId = requestAnimationFrame(update);
                                resolve();
                            } else if (e.data.type === "error") {
                                
                                document.getElementById("loaderSpinner")
                                    .style.visibility = 'hidden';
                                document
                                    .getElementById("loaderText")
                                    .textContent = "Error";
                                reject(new Error(e.data.error));
                            }
                        };

                        // while calculating, make the "loader" button visible with the message "Calculating..."
                        
                        document.getElementById("loaderSpinner")
                            .style.visibility = 'visible';
                        document.getElementById("loaderText")
                            .textContent = "Calculating... ";
                        // calculation message
                        worker.postMessage({
                            type: "calculate",
                            code: `lorenz.run(${n},${T})`,
                        });
                    });
                });

                // Initial calculation
                await form.requestSubmit();
            } catch (error) {
                console.error(error);
                document.getElementById("loaderSpinner")
                    .style.visibility = 'hidden';
                document.getElementById("loaderText")
                    .textContent = "Error";
                calculateButton.disabled = false;
            }
        }

        main();
    </script>
</html>
